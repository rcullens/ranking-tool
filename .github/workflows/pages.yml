name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static board for /ranking-tool/
        working-directory: web
        env:
          VITE_BASE: /ranking-tool/
          VITE_API_BASE: https://ranking-tool.vercel.app
        run: |
          npm install
          npm run build
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Turn on GitHub Pages from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s\n' '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}' > /tmp/pages.json
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" --input /tmp/pages.json
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" --input /tmp/pages.json
          gh api "/repos/${GITHUB_REPOSITORY}/pages" -H "Accept: application/vnd.github+json" || true
          exit 0

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
